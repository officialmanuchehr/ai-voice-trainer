<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Тренировка — AI Voice Trainer</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/static/css/app.css" />
<script src="/static/theme.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>
<div class="app-shell" id="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Основная навигация"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app-main">
    <header class="app-header">
      <button type="button" class="ghost icon-button menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Открыть меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="app-header-titles">
        <h1 id="page-title">Тренировка</h1>
        <p class="page-subtitle" id="page-subtitle">Каждый раз генерируется новый клиент. Результаты тренировок не влияют на KPI.</p>
      </div>
      <div class="app-header-actions" id="page-actions"></div>
    </header>

    <main id="main" class="app-content" tabindex="-1">
      <div class="page narrow">

        <!-- Catalogue -->
        <section id="catalog-view" class="stack">
          <div class="panel">
            <div class="section-head">
              <h2>Сценарии</h2><span class="spacer"></span>
              <label class="sr-only" for="product-filter">Продукт</label>
              <select id="product-filter"><option value="">Все продукты</option></select>
              <label class="sr-only" for="topic-filter">Тема</label>
              <select id="topic-filter"><option value="">Все темы</option></select>
              <label class="sr-only" for="difficulty-filter">Сложность</label>
              <select id="difficulty-filter">
                <option value="">Любая сложность</option>
                <option value="easy">Лёгкий</option><option value="medium">Средний</option><option value="hard">Сложный</option>
              </select>
            </div>
            <div class="cards" id="cards"></div>
          </div>

          <div class="panel">
            <h2>Мои тренировки</h2>
            <div class="table-wrap"><table id="history"></table></div>
          </div>
        </section>

        <!-- Session -->
        <section id="session-view" class="hidden stack">
          <div class="panel" id="context"></div>

          <div class="panel" id="chat" aria-live="polite"></div>

          <div class="composer">
            <button type="button" id="mic-btn" title="Удерживайте, чтобы записать реплику">🎤 Удерживать и говорить</button>
            <label class="sr-only" for="text-input">Реплика</label>
            <input type="text" id="text-input" placeholder="…или напишите реплику" />
            <button type="button" id="send-btn">Отправить</button>
          </div>
          <div class="row">
            <button type="button" class="secondary" id="finish-btn">Завершить и получить оценку</button>
            <span id="processing" class="hidden" role="status"></span>
          </div>

          <div class="panel hidden" id="result"></div>
          <div class="row hidden" id="after-actions">
            <button type="button" id="repeat-btn">Повторить сценарий</button>
            <button type="button" class="secondary" id="back-btn">К списку тренировок</button>
          </div>
        </section>

        <audio id="audio-player" class="hidden"></audio>
      </div>
    </main>
  </div>
</div>
<div class="toast-region" id="toast-region" aria-live="polite"></div>

<script src="/static/app.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/shell.js"></script>
<script src="/static/js/pages/training.js"></script>
</body>
</html>
